name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (with retry)
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "=== Attempt $i/3 ==="
            if npm ci; then
              echo "✅ npm ci succeeded on attempt $i"
              exit 0
            fi
            echo "❌ Attempt $i failed, waiting 10s..."
            sleep 10
          done
          echo "❌ All 3 attempts failed"
          exit 1

      - name: Build & Package Electron app
        run: npm run electron:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up intermediate build artifacts
        shell: bash
        run: |
          # 保留最终安装包，删除 unpacked 中间目录和无关文件
          # 最终产物: *.exe, *.dmg, *.zip, *.AppImage, *.blockmap
          echo "=== Before cleanup ==="
          ls -la release/ 2>/dev/null | head -20

          # 删除 unpacked 目录（中间打包产物）
          rm -rf release/*-unpacked release/*-arm64 release/*-x64

          # 删除无关文件（builder debug、Electron Framework 解包等）
          find release/ -maxdepth 1 \
            ! -name '*.exe' \
            ! -name '*.dmg' \
            ! -name '*.zip' \
            ! -name '*.AppImage' \
            ! -name '*.blockmap' \
            -delete

          echo "=== After cleanup ==="
          ls -la release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: days-matter-desktop-${{ matrix.os }}
          path: release/*.{exe,dmg,zip,AppImage,blockmap}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
